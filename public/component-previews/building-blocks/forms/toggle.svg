<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-toggle">
  <title id="t-toggle">Toggle component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 334)">
    <rect x="360" y="0" width="97" height="52" rx="26" fill="var(--pv-ink, #08090B)"/>
    <circle cx="431" cy="26" r="18" fill="var(--pv-paper, #FFFFFF)"/>
    <rect x="494" y="13" width="426" height="26" rx="13" fill="var(--pv-subject, #A3ABB6)"/>
  </g>
</svg>
