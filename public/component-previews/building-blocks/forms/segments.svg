        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 302)">
