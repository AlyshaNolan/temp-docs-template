    <rect x="228" y="75" width="120" height="12" rx="6" fill="var(--pv-paper, #FFFFFF)"/>
    <rect x="480" y="46" width="320" height="70" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="2"/>
    <rect x="505" y="68" width="26" height="26" rx="10" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="548" y="75" width="120" height="12" rx="6" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="800" y="46" width="320" height="70" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="2"/>
    <rect x="825" y="68" width="26" height="26" rx="10" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="868" y="75" width="120" height="12" rx="6" fill="var(--pv-glyph, #CFD5DD)"/>
