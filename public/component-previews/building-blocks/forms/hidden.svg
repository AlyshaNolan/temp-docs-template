<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-hidden">
  <title id="t-hidden">Hidden component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 -40)">
    <rect x="260" y="330" width="760" height="140" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="3" stroke-dasharray="8 12"/>
    <rect x="310" y="392" width="180" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)" opacity="0.45"/>
    <rect x="530" y="394" width="240" height="12" rx="6" fill="var(--pv-body, #D8DDE4)" opacity="0.45"/>
  </g>
</svg>
