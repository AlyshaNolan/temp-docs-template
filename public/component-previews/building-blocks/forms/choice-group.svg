    <rect x="545" y="107" width="230" height="12" rx="6" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="505" y="156" width="26" height="26" rx="6" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="545" y="163" width="170" height="12" rx="6" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="505" y="212" width="26" height="26" rx="6" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="545" y="219" width="200" height="12" rx="6" fill="var(--pv-glyph, #CFD5DD)"/>
