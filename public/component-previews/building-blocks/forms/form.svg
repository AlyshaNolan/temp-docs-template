<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-form">
  <title id="t-form">Form component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 142)">
    <rect x="260" y="0" width="146" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="260" y="26" width="760" height="54" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="3"/>
    <rect x="260" y="108" width="205" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="260" y="134" width="760" height="54" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="3"/>
    <polygon points="965,158 978,158 972,165" fill="var(--pv-glyph, #CFD5DD)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="6" stroke-linejoin="round"/>
    <rect x="260" y="216" width="117" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="260" y="242" width="760" height="110" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="3"/>
    <rect x="260" y="384" width="166" height="52" rx="10" fill="var(--pv-ink, #08090B)"/>
    <rect x="312" y="406" width="62" height="8" rx="4" fill="var(--pv-on-ink, #8A9099)"/>
  </g>
</svg>
