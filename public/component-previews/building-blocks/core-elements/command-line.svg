<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-command-line">
  <title id="t-command-line">Command line component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 314)">
    <rect x="360" y="0" width="560" height="92" rx="12" fill="var(--pv-panel, #F6F7F9)" stroke="var(--pv-line, #E2E6EB)" stroke-width="2"/>
    <rect x="388" y="38" width="16" height="16" rx="8" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="420" y="38" width="330" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="784" y="32" width="100" height="28" rx="8" fill="var(--pv-line, #E2E6EB)"/>
  </g>
</svg>
