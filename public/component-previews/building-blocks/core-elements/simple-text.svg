<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-simple-text">
  <title id="t-simple-text">Simple text component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 -40)">
    <rect x="260" y="358" width="760" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="260" y="382" width="760" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="260" y="406" width="760" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="260" y="430" width="418" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
  </g>
