<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-figure">
  <title id="t-figure">Figure component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 190)">
    <rect x="260" y="0" width="760" height="300" rx="12" fill="var(--pv-surface, #ECEFF3)" stroke="var(--pv-line, #E2E6EB)" stroke-width="2"/>
    <circle cx="792" cy="96" r="18" fill="var(--pv-glyph, #CFD5DD)"/>
    <polygon points="429,227 579,158 691,227" fill="var(--pv-glyph, #CFD5DD)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="627,229 762,173 890,229" fill="var(--pv-glyph, #CFD5DD)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="10" stroke-linejoin="round"/>
    <rect x="260" y="328" width="400" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="900" y="328" width="120" height="12" rx="6" fill="var(--pv-subject, #A3ABB6)"/>
  </g>
</svg>
