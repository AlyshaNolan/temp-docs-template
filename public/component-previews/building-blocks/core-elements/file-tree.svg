<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-file-tree">
  <title id="t-file-tree">File tree component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 252)">
    <rect x="360" y="0" width="560" height="216" rx="12" fill="var(--pv-ink, #08090B)" stroke="var(--pv-line, #E2E6EB)" stroke-width="2"/>
    <rect x="360" y="0" width="560" height="56" rx="12" fill="var(--pv-panel, #F6F7F9)"/>
    <rect x="388" y="20" width="200" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="360" y="54" width="560" height="2" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="395" y="92" width="2" height="90" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="439" y="124" width="2" height="26" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="396" y="118" width="16" height="2" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="440" y="150" width="16" height="2" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="396" y="182" width="16" height="2" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="388" y="80" width="120" height="12" rx="6" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="420" y="112" width="200" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
    <rect x="464" y="144" width="170" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
    <rect x="420" y="176" width="140" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
  </g>
</svg>
