<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-video">
  <title id="t-video">Video component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 -40)">
    <rect x="160" y="130" width="960" height="540" rx="10" fill="var(--pv-surface, #ECEFF3)"/>
    <circle cx="640" cy="400" r="72" fill="var(--pv-subject, #A3ABB6)"/>
    <polygon points="625,376 625,424 667,400" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-paper, #FFFFFF)" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
