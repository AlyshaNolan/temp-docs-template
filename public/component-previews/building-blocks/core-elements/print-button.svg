<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-print-button">
  <title id="t-print-button">Print button component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 -40)">
    <rect x="490" y="362" width="300" height="76" rx="10" fill="var(--pv-ink, #08090B)"/>
    <rect x="536" y="384" width="20" height="10" rx="2" fill="var(--pv-on-ink, #8A9099)"/>
    <rect x="528" y="394" width="36" height="24" rx="4" fill="var(--pv-on-ink, #8A9099)"/>
    <polygon points="538,420 554,420 554,428 538,428" fill="var(--pv-on-ink, #8A9099)" stroke="var(--pv-on-ink, #8A9099)" stroke-width="4" stroke-linejoin="round"/>
    <rect x="582" y="394" width="150" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
  </g>
</svg>
