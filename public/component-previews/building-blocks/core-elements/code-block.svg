<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-code-block">
  <title id="t-code-block">Code block component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 244)">
    <rect x="260" y="0" width="760" height="232" rx="12" fill="var(--pv-ink, #08090B)" stroke="var(--pv-line, #E2E6EB)" stroke-width="2"/>
    <rect x="260" y="0" width="760" height="56" rx="12" fill="var(--pv-panel, #F6F7F9)"/>
    <rect x="288" y="20" width="200" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="912" y="20" width="80" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="260" y="54" width="760" height="2" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="288" y="84" width="300" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
    <rect x="260" y="116" width="6" height="28" fill="var(--pv-accent, #0F766E)"/>
    <rect x="288" y="122" width="430" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
    <rect x="288" y="160" width="250" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
    <rect x="288" y="192" width="120" height="12" rx="6" fill="var(--pv-on-ink, #8A9099)"/>
  </g>
</svg>
