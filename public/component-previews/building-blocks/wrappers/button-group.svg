<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-button-group">
  <title id="t-button-group">Button group component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 338)">
    <rect x="360" y="0" width="255" height="44" rx="10" fill="var(--pv-ink, #08090B)"/>
    <rect x="447" y="18" width="82" height="8" rx="4" fill="var(--pv-on-ink, #8A9099)"/>
    <rect x="640" y="0" width="280" height="44" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFD5DD)" stroke-width="2"/>
    <rect x="739" y="18" width="82" height="8" rx="4" fill="var(--pv-body, #D8DDE4)"/>
  </g>
</svg>
