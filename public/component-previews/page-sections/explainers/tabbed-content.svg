<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-tabbed-content">
  <title id="t-tabbed-content">Tabbed content component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 190)">
    <rect x="160" y="0" width="520" height="40" rx="20" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="160" y="96" width="960" height="244" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-line, #E2E6EB)" stroke-width="2"/>
    <rect x="162" y="98" width="956" height="64" rx="8" fill="var(--pv-panel, #F6F7F9)"/>
    <rect x="160" y="160" width="960" height="2" rx="1" fill="var(--pv-line, #E2E6EB)"/>
    <rect x="196" y="122" width="96" height="16" rx="8" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="184" y="156" width="120" height="4" rx="2" fill="var(--pv-accent, #0F766E)"/>
    <rect x="348" y="122" width="112" height="16" rx="8" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="516" y="122" width="84" height="16" rx="8" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="196" y="192" width="688" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="196" y="216" width="624" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="196" y="240" width="700" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="196" y="264" width="512" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
  </g>
</svg>
