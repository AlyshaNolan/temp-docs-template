<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-hero-center">
  <title id="t-hero-center">Hero center component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 -40)">
    <rect x="577" y="296" width="127" height="16" rx="8" fill="var(--pv-glyph, #CFD5DD)"/>
    <rect x="313" y="328" width="654" height="40" rx="20" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="260" y="392" width="760" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="374" y="416" width="532" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="561" y="460" width="158" height="44" rx="10" fill="var(--pv-ink, #08090B)"/>
    <rect x="606" y="478" width="68" height="8" rx="4" fill="var(--pv-on-ink, #8A9099)"/>
  </g>
</svg>
