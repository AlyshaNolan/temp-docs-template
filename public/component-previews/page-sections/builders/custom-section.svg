<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-custom-section">
  <title id="t-custom-section">Custom section component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #08090B;
        --pv-panel: #101216;
        --pv-surface: #191D23;
        --pv-line: #23272F;
        --pv-glyph: #333944;
        --pv-body: #2B313A;
        --pv-subject: #555B64;
        --pv-ink: #F3F5F8;
        --pv-on-ink: #6C737E;
        --pv-accent: #5EEAD4;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 240)">
    <rect x="80" y="0" width="1120" height="240" fill="var(--pv-surface, #ECEFF3)"/>
    <rect x="139" y="70" width="511" height="26" rx="13" fill="var(--pv-subject, #A3ABB6)"/>
    <rect x="139" y="122" width="747" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
    <rect x="139" y="146" width="413" height="12" rx="6" fill="var(--pv-body, #D8DDE4)"/>
  </g>
</svg>
