badge:
  template: mdx_component
  inline: false
  preview:
    text:
      - template: "Badge - {text}"
      - Badge
    subtext:
      - key: variant
    image: public/component-previews/building-blocks/core-elements/badge.svg
    icon: label
    gallery:
      image: public/component-previews/building-blocks/core-elements/badge.svg
      fit: cover
  definitions:
    component_name: Badge
    named_args:
      - editor_key: text
        type: string
        optional: true
        remove_empty: true
      - editor_key: variant
        type: string
        optional: true
        remove_empty: true
      - editor_key: size
        type: string
        optional: true
        remove_empty: true
      - editor_key: iconName
        type: string
        optional: true
        remove_empty: true
      - editor_key: showDot
        type: boolean
        optional: true
      - editor_key: link
        type: string
        optional: true
        remove_empty: true
      - editor_key: showArrow
        type: boolean
        optional: true
      - editor_key: alignmentHorizontal
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/badge/badge.cloudcannon.inputs.yml
