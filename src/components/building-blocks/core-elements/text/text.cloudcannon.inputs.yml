text:
  comment: The content for the text component (Markdown format). Leave empty to use slot content instead.
  type: markdown
  options:
    blockquote: false
    bold: true
    format: p h1 h2 h3 h4 h5 h6 pre
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: true
    numberedlist: true
    indent: true
    outdent: true
    code: true
    allow_custom_markup: true
    styles: public/cloudcannon/editor-styles.css
alignmentHorizontal:
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
  comment: The horizontal alignment of the text component.
size:
  type: select
  comment: The font size of paragraphs and lists. Does not affect headings.
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
