tabs:
  type: array
  comment: One entry per language. Tabs with the same label agree across every block on the site, which is how the reader's choice carries between pages.
  options:
    structures: _structures.codeTabs
filename:
  type: text
  comment: Optional path shown at the end of the tab bar.
showCopy:
  type: switch
  comment: Show the copy button. It copies the visible tab only.

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
