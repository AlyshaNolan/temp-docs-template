code-tabs:
  template: mdx_component
  inline: false
  preview:
    text:
      - Code Tabs
    image: public/component-previews/building-blocks/core-elements/code-tabs.svg
    icon: tab
    gallery:
      image: public/component-previews/building-blocks/core-elements/code-tabs.svg
      fit: cover
  definitions:
    component_name: CodeTabs
    named_args:
      - editor_key: tabs
        type: array
      - editor_key: filename
        type: string
        optional: true
        remove_empty: true
      - editor_key: showCopy
        type: boolean
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/code-tabs/code-tabs.cloudcannon.inputs.yml
