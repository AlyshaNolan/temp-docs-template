# Raw, not `mdx_component`: CloudCannon writes a multi-line string prop with raw
# newlines, which MDX can't parse. Each tab's code sits in a fence, read as raw
# text, and `src/utils/codeTabsPlugin.mjs` folds it back into `tabs`.
code-tabs:
  snippet: "<CodeTabs[[code_tabs_args]]>[[tabs]]</CodeTabs>"
  inline: false
  preview:
    text:
      - Code Tabs
    image: public/component-previews/building-blocks/core-elements/code-tabs.svg
    icon: tab
    gallery:
      image: public/component-previews/building-blocks/core-elements/code-tabs.svg
      fit: cover
  params:
    code_tabs_args:
      parser: key_values
      options:
        models:
          - editor_key: filename
            type: string
            optional: true
            remove_empty: true
          - editor_key: showCopy
            type: boolean
            optional: true
            remove_empty: true
        format:
          root_value_delimiter: "="
          root_pair_delimiter:
            - " "
          root_value_boundary:
            start: "{"
            end: "}"
          root_value_boundary_optional:
            string: true
          string_boundary:
            - '"'
          string_escape_character: \
          allow_booleans: true
        style:
          output: inline
          inline:
            leading: " "
    tabs:
      parser: repeating
      options:
        snippet: "<CodeTab[[tab_args]]>\n\n[[fence]]\n[[code]]\n[[fence]]\n\n</CodeTab>"
        editor_key: tabs
        default_length: 2
        style:
          output: block
          between: "\n"
          block:
            leading: "\n"
            trailing: "\n"
    tab_args:
      parser: key_values
      options:
        models:
          - editor_key: label
            type: string
          - editor_key: language
            type: string
          - editor_key: highlight
            type: string
            optional: true
            remove_empty: true
        format:
          root_value_delimiter: "="
          root_pair_delimiter:
            - " "
          string_boundary:
            - '"'
          string_escape_character: \
        style:
          output: inline
          inline:
            leading: " "
    fence:
      parser: repeating_literal
      options:
        literal: "`"
        minimum: 3
        default: 3
    code:
      parser: content
      options:
        editor_key: code
        raw: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/code-tabs/code-tabs.cloudcannon.inputs.yml
