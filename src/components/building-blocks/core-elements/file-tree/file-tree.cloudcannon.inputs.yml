paths:
  type: code
  comment: 'One path per line; indent a line to nest it under the line above. Any consistent unit works — the connectors are drawn from the relative indent, not a fixed width. Start a line with "+", "-" or "~" to mark that entry added, removed or highlighted.'
  options:
    max_visible_lines: 20
title:
  type: text
  comment: Shown in the header bar. Empty hides the bar entirely.
showCopy:
  type: switch
  comment: Show the copy button. Off by default — the drawn connectors are rarely worth copying.

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
