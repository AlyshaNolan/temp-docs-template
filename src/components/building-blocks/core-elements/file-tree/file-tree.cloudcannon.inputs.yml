paths:
  type: code
  comment: "One path per line; indent a line to nest it under the line above. Any consistent unit works — the connectors are drawn from the relative indent, not a fixed width."
  options:
    max_visible_lines: 20
added:
  type: text
  comment: 'Lines added, 1-based: "3" or "3,7-9". Empty marks nothing.'
removed:
  type: text
  comment: 'Lines removed, 1-based: "2" or "2,5-6". Empty marks nothing.'
highlight:
  type: text
  comment: 'Lines to highlight, 1-based: "2" or "1,4-6". Empty highlights nothing.'
title:
  type: text
  comment: Shown in the header bar. Empty hides the bar entirely.
showCopy:
  type: switch
  comment: Show the copy button. Off by default — the drawn connectors are rarely worth copying.

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
