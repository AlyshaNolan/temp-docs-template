# Raw, not `mdx_component`: CloudCannon writes a multi-line string prop with raw
# newlines, which MDX can't parse. `paths` sits in a fence, read as raw text,
# and `src/utils/codeFencePlugin.mjs` folds it back into the prop.
file-tree:
  snippet: "<FileTree[[file_tree_args]]>\n\n[[fence]]\n[[paths]]\n[[fence]]\n\n</FileTree>"
  inline: false
  preview:
    text:
      - File Tree
    image: public/component-previews/building-blocks/core-elements/file-tree.svg
    icon: account_tree
    gallery:
      image: public/component-previews/building-blocks/core-elements/file-tree.svg
      fit: cover
  params:
    file_tree_args:
      parser: key_values
      options:
        models:
          - editor_key: title
            type: string
            optional: true
            remove_empty: true
          - editor_key: added
            type: string
            optional: true
            remove_empty: true
          - editor_key: removed
            type: string
            optional: true
            remove_empty: true
          - editor_key: highlight
            type: string
            optional: true
            remove_empty: true
          - editor_key: showCopy
            type: boolean
            default: true
        format:
          root_value_delimiter: "="
          root_pair_delimiter:
            - " "
          root_value_boundary:
            start: "{"
            end: "}"
          root_value_boundary_optional:
            string: true
          string_boundary:
            - '"'
          string_escape_character: \
          allow_booleans: true
          allow_numbers: true
          object_boundary:
            start: "{"
            end: "}"
          object_value_delimiter: ":"
          object_pair_delimiter: ","
          array_boundary:
            start: "["
            end: "]"
          array_delimiter: ","
        style:
          output: inline
          inline:
            leading: " "
    fence:
      parser: repeating_literal
      options:
        literal: "`"
        minimum: 3
        default: 3
    paths:
      parser: content
      options:
        editor_key: paths
        raw: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/file-tree/file-tree.cloudcannon.inputs.yml
