file-tree:
  template: mdx_component
  inline: false
  preview:
    text:
      - File Tree
    image: public/component-previews/building-blocks/core-elements/file-tree.svg
    icon: account_tree
    gallery:
      image: public/component-previews/building-blocks/core-elements/file-tree.svg
      fit: cover
  definitions:
    component_name: FileTree
    named_args:
      - editor_key: paths
        type: string
      - editor_key: title
        type: string
        optional: true
        remove_empty: true
      - editor_key: showCopy
        type: boolean
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/file-tree/file-tree.cloudcannon.inputs.yml
