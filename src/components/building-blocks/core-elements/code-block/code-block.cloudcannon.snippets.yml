code-block:
  template: mdx_component
  inline: false
  preview:
    text:
      - Code Block
    image: public/component-previews/building-blocks/core-elements/code-block.svg
    icon: code
    gallery:
      image: public/component-previews/building-blocks/core-elements/code-block.svg
      fit: cover
  definitions:
    component_name: CodeBlock
    named_args:
      - editor_key: code
        type: string
      - editor_key: language
        type: string
        optional: true
        remove_empty: true
      - editor_key: filename
        type: string
        optional: true
        remove_empty: true
      - editor_key: highlight
        type: string
        optional: true
        remove_empty: true
      - editor_key: showCopy
        type: boolean
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/code-block/code-block.cloudcannon.inputs.yml
