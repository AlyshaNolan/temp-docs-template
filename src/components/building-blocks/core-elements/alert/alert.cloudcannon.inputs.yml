variant:
  type: select
  comment: The tone of the callout. Pick by what the reader loses if they skip it.
  options:
    preview:
      text:
        - key: name
      subtext:
        - key: description
    values:
      - id: note
        name: Note
        description: Context worth knowing. Nothing breaks if it is skipped.
      - id: tip
        name: Tip
        description: A shortcut or better way to do what they are already doing.
      - id: info
        name: Info
        description: A neutral aside — version support, related reading, scope.
      - id: warning
        name: Warning
        description: Something surprising that costs them time to discover alone.
      - id: danger
        name: Danger
        description: Irreversible. Data loss, downtime, or a breaking change.
title:
  type: text
  comment: Optional bold first line. Say what the reader needs to know, not "Note".
text:
  type: markdown
  comment: The callout body.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: true
    numberedlist: true
iconName:
  type: select
  comment: Optional icon. Callouts read fine without one — add it only when the icon carries meaning. Sourced from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
