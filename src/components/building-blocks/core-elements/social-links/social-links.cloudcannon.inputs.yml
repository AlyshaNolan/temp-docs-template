links:
  type: array
  comment: The social links, in order. Uses the same shape as the footer's socials.
  options:
    structures: _structures.socials
variant:
  type: select
  comment: Ghost icons stay quiet; solid tiles use the brand fill and read like buttons.
  options:
    values:
      - id: ghost
        name: Ghost
      - id: solid
        name: Solid
size:
  type: select
  comment: The hit-area size. Medium is the 44px touch-target minimum; small suits footer rows.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
alignmentHorizontal:
  type: select
  comment: Horizontal alignment of the row.
  options:
    values:
      - id: none
        name: None (in flow)
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
