definition:
  type: code
  comment: Mermaid source. Flowcharts, sequence diagrams, state machines and ER diagrams are supported — see mermaid.js.org for the syntax.
  options:
    max_visible_lines: 16
caption:
  type: text
  comment: Optional caption under the diagram.

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
