# Raw, not `mdx_component`: CloudCannon writes a multi-line string prop with raw
# newlines, which MDX can't parse. `definition` sits in a fence, read as raw text,
# and `src/utils/codeFencePlugin.mjs` folds it back into the prop.
diagram:
  snippet: "<Diagram[[diagram_args]]>\n\n[[fence]]\n[[definition]]\n[[fence]]\n\n</Diagram>"
  inline: false
  preview:
    text:
      - Diagram
    image: public/component-previews/building-blocks/core-elements/diagram.svg
    icon: account_tree
    gallery:
      image: public/component-previews/building-blocks/core-elements/diagram.svg
      fit: cover
  params:
    diagram_args:
      parser: key_values
      options:
        models:
          - editor_key: caption
            type: string
            optional: true
            remove_empty: true
        format:
          root_value_delimiter: "="
          root_pair_delimiter:
            - " "
          root_value_boundary:
            start: "{"
            end: "}"
          root_value_boundary_optional:
            string: true
          string_boundary:
            - '"'
          string_escape_character: \
          allow_booleans: true
          allow_numbers: true
          object_boundary:
            start: "{"
            end: "}"
          object_value_delimiter: ":"
          object_pair_delimiter: ","
          array_boundary:
            start: "["
            end: "]"
          array_delimiter: ","
        style:
          output: inline
          inline:
            leading: " "
    fence:
      parser: repeating_literal
      options:
        literal: "`"
        minimum: 3
        default: 3
    definition:
      parser: content
      options:
        editor_key: definition
        raw: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/diagram/diagram.cloudcannon.inputs.yml
