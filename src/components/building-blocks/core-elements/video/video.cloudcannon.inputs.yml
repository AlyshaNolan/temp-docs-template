type:
  type: select
  label: Where the video lives
  comment: Embed from YouTube or Vimeo, or play a file uploaded to this site.
  options:
    values:
      - id: youtube
        name: YouTube
      - id: vimeo
        name: Vimeo
      - id: local-source
        name: Uploaded file
title:
  type: text
  comment: YouTube and Vimeo only — what the video is called. Screen readers announce it, and it shows as a tooltip on hover.
videoId:
  type: text
  label: Video ID
  comment: YouTube and Vimeo only — the ID from the video's URL, the part after `v=` on YouTube or the number on Vimeo.
source:
  type: file
  label: Video file
  comment: Uploaded files only — the video to play. Other formats uploaded under the same filename are offered to the browser automatically.
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
autoplay:
  type: switch
  comment: Start playing automatically. The video is muted so browsers allow it; YouTube and Vimeo players load when scrolled into view instead of waiting for a click.
loop:
  type: switch
  comment: Restart the video from the beginning when it ends.
thumbnail:
  type: image
  comment: Still image shown before the video plays.
  options:
    accepts_mime_types:
      - image/jpeg
      - image/png
      - image/webp
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1080

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
