figure:
  template: mdx_component
  inline: false
  preview:
    text:
      - Figure
    image: public/component-previews/building-blocks/core-elements/figure.svg
    icon: image
    gallery:
      image: public/component-previews/building-blocks/core-elements/figure.svg
      fit: cover
  definitions:
    component_name: Figure
    named_args:
      - editor_key: source
        type: string
      - editor_key: alternateSource
        type: string
        optional: true
        remove_empty: true
      - editor_key: alt
        type: string
      - editor_key: caption
        type: string
        optional: true
        remove_empty: true
      - editor_key: zoom
        type: boolean
        optional: true
        remove_empty: true
      - editor_key: aspectRatio
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/figure/figure.cloudcannon.inputs.yml
