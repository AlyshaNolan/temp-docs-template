source:
  type: image
  comment: The image. Required.
  options:
    paths:
      uploads: src/assets/images
alternateSource:
  type: image
  comment: Shown in dark mode. Without it, a screenshot of a light UI stays light on a dark page.
  options:
    paths:
      uploads: src/assets/images
alt:
  type: text
  comment: What the image shows, for readers who can't see it. Required.
caption:
  type: text
  comment: Optional caption under the image.
zoom:
  type: switch
  comment: Let readers click the image to see it full-size.
aspectRatio:
  type: select
  comment: Crop the image to a fixed ratio. None keeps its own proportions.
  options:
    values:
      - id: none
        name: None
      - id: square
        name: Square
      - id: landscape
        name: Landscape
      - id: portrait
        name: Portrait
      - id: widescreen
        name: Widescreen

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
