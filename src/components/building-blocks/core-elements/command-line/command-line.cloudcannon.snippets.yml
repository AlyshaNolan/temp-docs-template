command-line:
  template: mdx_component
  inline: false
  preview:
    text:
      - Command Line
    subtext:
      - key: command
    image: public/component-previews/building-blocks/core-elements/command-line.svg
    icon: terminal
    gallery:
      image: public/component-previews/building-blocks/core-elements/command-line.svg
      fit: cover
  definitions:
    component_name: CommandLine
    named_args:
      - editor_key: command
        type: string
      - editor_key: prompt
        type: string
        optional: true
        remove_empty: true
      - editor_key: showCopy
        type: boolean
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/command-line/command-line.cloudcannon.inputs.yml
