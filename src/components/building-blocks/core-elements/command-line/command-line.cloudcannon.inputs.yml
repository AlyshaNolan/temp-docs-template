command:
  type: text
  comment: The command, without a leading prompt character.
prompt:
  type: text
  comment: The prompt shown before the command. Decorative — it is hidden from screen readers and never copied.
showCopy:
  type: switch
  comment: Show the copy button.

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
