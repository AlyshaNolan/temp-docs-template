code-diff:
  template: mdx_component
  inline: false
  preview:
    text:
      - Code Diff
    image: public/component-previews/building-blocks/core-elements/code-diff.svg
    icon: difference
    gallery:
      image: public/component-previews/building-blocks/core-elements/code-diff.svg
      fit: cover
  definitions:
    component_name: CodeDiff
    named_args:
      - editor_key: code
        type: string
      - editor_key: language
        type: string
        optional: true
        remove_empty: true
      - editor_key: filename
        type: string
        optional: true
        remove_empty: true
      - editor_key: showCopy
        type: boolean
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/code-diff/code-diff.cloudcannon.inputs.yml
