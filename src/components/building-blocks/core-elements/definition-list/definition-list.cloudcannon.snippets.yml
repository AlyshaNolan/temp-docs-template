definition-list:
  template: mdx_component
  inline: false
  preview:
    text:
      - Definition List
    image: public/component-previews/building-blocks/core-elements/definition-list.svg
    icon: list
    gallery:
      image: public/component-previews/building-blocks/core-elements/definition-list.svg
      fit: cover
  definitions:
    component_name: DefinitionList
    named_args:
      - editor_key: items
        type: array
      - editor_key: layout
        type: string
        optional: true
        remove_empty: true
      - editor_key: alignmentHorizontal
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/definition-list/definition-list.cloudcannon.inputs.yml
  _structures_from_glob:
    - /.cloudcannon/structures/definitionListItems.cloudcannon.structures.yml
