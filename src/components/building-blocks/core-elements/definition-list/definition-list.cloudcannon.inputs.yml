items:
  type: array
  label: List Items
  options:
    structures: _structures.definitionListItems
layout:
  type: select
  comment: Stacked reads as a glossary — term, then its definition indented under it. Grid puts terms in a column, for short spec rows.
  options:
    values:
      - id: stacked
        name: Stacked
      - id: grid
        name: Grid
alignmentHorizontal:
  type: select
  comment: The horizontal alignment of the definition list items. Grid layout only.
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
