print-button:
  template: mdx_component
  inline: false
  preview:
    text:
      - Print Button
    subtext:
      - key: text
    image: public/component-previews/building-blocks/core-elements/print-button.svg
    icon: print
    gallery:
      image: public/component-previews/building-blocks/core-elements/print-button.svg
      fit: cover
  definitions:
    component_name: PrintButton
    named_args:
      - editor_key: text
        type: string
        optional: true
        remove_empty: true
      - editor_key: variant
        type: string
        optional: true
        remove_empty: true
      - editor_key: size
        type: string
        optional: true
        remove_empty: true
      - editor_key: iconName
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/print-button/print-button.cloudcannon.inputs.yml
