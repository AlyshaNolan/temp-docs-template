text:
  type: text
  comment: The button's label.
variant:
  type: select
  comment: The button's style.
  options:
    values:
      - id: primary
        name: Primary
      - id: secondary
        name: Secondary
      - id: tertiary
        name: Tertiary
      - id: ghost
        name: Ghost
      - id: text
        name: Text
size:
  type: select
  comment: The button's size.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
iconName:
  type: select
  comment: Optional icon. Sourced from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconPosition:
  type: select
  comment: Which side of the label the icon sits on.
  options:
    values:
      - id: before
        name: Before
      - id: after
        name: After
