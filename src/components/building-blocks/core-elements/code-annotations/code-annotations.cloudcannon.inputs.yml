code:
  type: code
  comment: The sample itself. Indentation is preserved exactly as typed.
  options:
    max_visible_lines: 20
language:
  type: select
  comment: Language for syntax highlighting.
  options:
    values:
      - id: astro
        name: astro
      - id: bash
        name: bash
      - id: css
        name: css
      - id: diff
        name: diff
      - id: html
        name: html
      - id: js
        name: js
      - id: json
        name: json
      - id: jsx
        name: jsx
      - id: markdown
        name: markdown
      - id: mdx
        name: mdx
      - id: python
        name: python
      - id: ruby
        name: ruby
      - id: sh
        name: sh
      - id: ts
        name: ts
      - id: tsx
        name: tsx
      - id: yaml
        name: yaml
      - id: text
        name: text
filename:
  type: text
  comment: Shown in the header bar. Falls back to the language when empty.
highlight:
  type: text
  comment: 'Extra lines to highlight beyond the annotated ones: "1,4-6".'
notes:
  type: array
  comment: One note per marked line. A note pointing past the end of the code is dropped rather than rendered against nothing.
  options:
    structures: _structures.codeAnnotations
showCopy:
  type: switch
  comment: Show the copy button.
