# Raw, not `mdx_component`: CloudCannon writes a multi-line string prop with raw
# newlines, which MDX can't parse. `code` sits in a fence, read as raw text,
# and `src/utils/codeFencePlugin.mjs` folds it back into the prop.
code-annotations:
  snippet: "<CodeAnnotations[[code_annotations_args]]>\n\n[[fence]]\n[[code]]\n[[fence]]\n\n</CodeAnnotations>"
  inline: false
  preview:
    text:
      - Annotated Code
    image: public/component-previews/building-blocks/core-elements/code-annotations.svg
    icon: format_list_numbered
    gallery:
      image: public/component-previews/building-blocks/core-elements/code-annotations.svg
      fit: cover
  params:
    code_annotations_args:
      parser: key_values
      options:
        models:
          - editor_key: language
            type: string
          - editor_key: filename
            type: string
            optional: true
            remove_empty: true
          - editor_key: highlight
            type: string
            optional: true
            remove_empty: true
          - editor_key: notes
            type: array
            optional: true
            remove_empty: true
          - editor_key: showCopy
            type: boolean
            optional: true
            default: true
        format:
          root_value_delimiter: "="
          root_pair_delimiter:
            - " "
          root_value_boundary:
            start: "{"
            end: "}"
          root_value_boundary_optional:
            string: true
          string_boundary:
            - '"'
          string_escape_character: \
          allow_booleans: true
          allow_numbers: true
          object_boundary:
            start: "{"
            end: "}"
          object_value_delimiter: ":"
          object_pair_delimiter: ","
          array_boundary:
            start: "["
            end: "]"
          array_delimiter: ","
        style:
          output: inline
          inline:
            leading: " "
    fence:
      parser: repeating_literal
      options:
        literal: "`"
        minimum: 3
        default: 3
    code:
      parser: content
      options:
        editor_key: code
        raw: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/code-annotations/code-annotations.cloudcannon.inputs.yml
