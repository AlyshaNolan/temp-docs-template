label:
  comment: Optional label for the accordion to help identify it in the editor.
  type: text
items:
  comment: The items to display in the accordion.
  type: array
  options:
    structures: _structures.accordionItems
openFirst:
  comment: Whether the first item will be open by default.
  type: switch
singleOpen:
  comment: Whether only one item can be open at a time within this accordion.
  type: switch

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
