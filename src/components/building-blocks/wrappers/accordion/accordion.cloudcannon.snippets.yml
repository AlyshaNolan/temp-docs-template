accordion:
  template: mdx_component
  inline: false
  preview:
    text:
      - Accordion
    subtext:
      - key: label
    image: public/component-previews/building-blocks/wrappers/accordion.svg
    icon: expand_all
    gallery:
      image: public/component-previews/building-blocks/wrappers/accordion.svg
      fit: cover
  definitions:
    component_name: Accordion
    named_args:
      - editor_key: label
        type: string
        optional: true
        remove_empty: true
      - editor_key: items
        type: array
      - editor_key: openFirst
        type: boolean
        optional: true
      - editor_key: singleOpen
        type: boolean
        optional: true
  _inputs_from_glob:
    - /src/components/building-blocks/wrappers/accordion/accordion.cloudcannon.inputs.yml
  _structures_from_glob:
    - /.cloudcannon/structures/accordionItems.cloudcannon.structures.yml
    - /.cloudcannon/structures/accordionSections.cloudcannon.structures.yml
