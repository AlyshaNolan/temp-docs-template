steps:
  template: mdx_component
  inline: false
  preview:
    text:
      - Steps
    subtext:
      - key: label
    image: public/component-previews/building-blocks/wrappers/steps.svg
    icon: format_list_numbered
    gallery:
      image: public/component-previews/building-blocks/wrappers/steps.svg
      fit: cover
  definitions:
    component_name: Steps
    named_args:
      - editor_key: label
        type: string
        optional: true
        remove_empty: true
      - editor_key: items
        type: array
      - editor_key: orientation
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageAspectRatio
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/wrappers/steps/steps.cloudcannon.inputs.yml
