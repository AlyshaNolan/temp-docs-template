label:
  comment: Optional label for the content selector to help identify it in the editor.
  type: text
items:
  type: array
  comment: The tabs to switch between. Each item is one tab and the panel it shows.
  options:
    structures: _structures.contentSelectorItems
variant:
  type: select
  comment: Panel frames the tabs and content in one bordered box with a compact strip of labels — a demo panel. Plain leaves them as part of the page. Panel needs the tabs on top.
  options:
    values:
      - id: plain
        name: Plain
      - id: panel
        name: Panel
navigationPosition:
  type: select
  comment: Where the tabs sit relative to the panel. Both collapse to an accordion on narrow screens.
  options:
    values:
      - id: start
        name: Start
      - id: top
        name: Top

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
