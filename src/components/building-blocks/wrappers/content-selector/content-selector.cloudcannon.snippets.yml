# Raw rather than `mdx_paired_component`: the panels are a `repeating` parser so
# each one is an array item, and its body is `content` with `allow_nested`, which
# is what lets an Alert or CodeBlock sit inside a tab. Never give
# `ContentSelectorPanel` its own snippet — it would match standalone and steal
# the panels, leaving this one empty.
content-selector:
  snippet: "<ContentSelector [[selector_args]]>[[panels]]</ContentSelector>"
  inline: false
  preview:
    text:
      - Content Selector
    subtext:
      - template: "{panels|array_length} tabs"
    image: public/component-previews/building-blocks/wrappers/content-selector.svg
    icon: view_sidebar
    gallery:
      image: public/component-previews/building-blocks/wrappers/content-selector.svg
      fit: cover
  params:
    selector_args:
      parser: key_values
      options:
        models:
          - editor_key: navigationPosition
            type: string
            default: top
          - editor_key: variant
            type: string
            default: panel
          - editor_key: label
            type: string
            optional: true
            remove_empty: true
        format:
          root_value_delimiter: "="
          root_pair_delimiter:
            - " "
          string_boundary:
            - '"'
          string_escape_character: \
    panels:
      parser: repeating
      options:
        snippet: "<ContentSelectorPanel [[panel_args]]>[[content]]</ContentSelectorPanel>"
        editor_key: panels
        default_length: 2
        style:
          output: block
          between: "\n\n"
          block:
            leading: "\n\n"
            trailing: "\n\n"
    panel_args:
      parser: key_values
      options:
        models:
          - editor_key: title
            type: string
            default: Tab
          - editor_key: subtext
            type: string
            optional: true
            remove_empty: true
          - editor_key: iconName
            type: string
            optional: true
            remove_empty: true
        format:
          root_value_delimiter: "="
          root_pair_delimiter:
            - " "
          string_boundary:
            - '"'
          string_escape_character: \
    content:
      parser: content
      options:
        editor_key: content
        allow_nested: true
        optional: true
        trim_text: true
        style:
          block:
            leading: "\n\n"
            trailing: "\n\n"
  _inputs:
    panels:
      type: array
      comment: The tabs to switch between. Each tab's content can hold text and other snippets.
      options:
        structures:
          values:
            - label: Tab
              icon: tab
              value:
                title: Tab
                subtext: ""
                iconName: ""
                content: ""
              preview:
                text:
                  - key: title
                  - Tab
    title:
      type: text
      comment: The tab's label.
    subtext:
      type: text
      comment: Optional supporting text shown beneath the tab label.
    iconName:
      type: select
      comment: The name of the icon to display. Sourced from [Heroicons](https://heroicons.com/).
      options:
        values: data.icons
    content:
      type: markdown
      comment: What the tab shows. Insert snippets — a callout, a code block — from the toolbar.
    # Inlined, not globbed: the inputs file's `items` names a structure this
    # snippet can't see. Keep these comments in step with that file.
    label:
      type: text
      comment: Optional label for the content selector to help identify it in the editor.
    variant:
      type: select
      comment: Panel frames the tabs and content in one bordered box with a compact strip of labels — a demo panel. Plain leaves them as part of the page. Panel needs the tabs on top.
      options:
        values:
          - id: plain
            name: Plain
          - id: panel
            name: Panel
    navigationPosition:
      type: select
      comment: Where the tabs sit relative to the panel. Both collapse to an accordion on narrow screens.
      options:
        values:
          - id: start
            name: Start
          - id: top
            name: Top
