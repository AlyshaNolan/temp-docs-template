label:
  comment: Optional label for the button group to help identify it in the editor.
  type: text
buttonSections:
  type: array
  comment: Array of button components to render within the group.
  options:
    structures: _structures.buttonSections
direction:
  comment: Direction of button layout.
  type: select
  options:
    values:
      - id: row
        name: Row
      - id: column
        name: Column
alignmentHorizontal:
  comment: The horizontal alignment of the buttons within the group.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
