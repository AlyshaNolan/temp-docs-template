label:
  type: text
  comment: The label shown above the dropdown.
name:
  type: text
  comment: The key this field's answer arrives under in the submission. Must be unique within the form.
  options:
    required: true
    required_message: Only form elements with a name will have their values passed when submitting a form.
required:
  type: switch
  comment: Whether the field is required.
options:
  type: array
  comment: The choices in the dropdown. Label is what the visitor reads; value is what gets submitted.
  options:
    structures: _structures.selectOptions
    min_items: 2
    min_items_message: At least two options are required.
placeholder:
  type: text
  comment: Placeholder text for the select field.
value:
  type: text
  comment: The default selected value.
hint:
  type: text
  comment: Optional help text shown between the label and the field, announced to assistive technology.
autocomplete:
  type: select
  options:
    values: data.autocomplete_tokens
    value_key: id
    allow_create: true
    preview:
      text:
        - key: name
      subtext:
        - key: id
  comment: Autofill hint for browsers and password managers (WCAG 1.3.5). Leave blank to derive one from the field's type and name. Compound tokens such as `shipping street-address` can be typed in.
iconName:
  type: select
  comment: Optional icon shown at the start of the dropdown. Sourced from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: The color of the icon.
  hidden: "!iconName"
  options:
    values:
      - id: default
        name: Default
      - id: blue
        name: Blue
      - id: green
        name: Green
      - id: yellow
        name: Yellow
      - id: orange
        name: Orange
      - id: red
        name: Red
      - id: purple
        name: Purple
      - id: pink
        name: Pink
      - id: cyan
        name: Cyan
