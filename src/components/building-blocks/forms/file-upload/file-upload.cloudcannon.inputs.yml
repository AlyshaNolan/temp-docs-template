label:
  type: text
  comment: The label text for the file upload field.
name:
  type: text
  comment: The key this field's answer arrives under in the submission. Must be unique within the form.
  options:
    required: true
    required_message: Only form elements with a name will have their values passed when submitting a form.
required:
  type: switch
  comment: Whether the field is required.
accept:
  type: text
  comment: Comma-separated list of accepted file types (eg. '.jpg,.png,.pdf').
multiple:
  type: switch
  comment: Whether multiple files can be selected.
hint:
  type: text
  comment: Optional help text shown between the label and the field, announced to assistive technology.
