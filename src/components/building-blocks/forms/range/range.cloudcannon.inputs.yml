label:
  type: text
  comment: The label shown above the slider.
name:
  type: text
  comment: The key this field's answer arrives under in the submission. Must be unique within the form.
min:
  type: number
  comment: The minimum value of the range.
max:
  type: number
  comment: The maximum value of the range.
step:
  type: number
  comment: The step increment between values.
value:
  type: number
  comment: The default value for the range field.
unit:
  type: text
  comment: Optional unit suffix shown next to the value (e.g. "%", "px").
required:
  type: switch
  comment: Whether the field is required.
showValue:
  type: switch
  comment: Show the current number beside the label as the visitor drags.
hint:
  type: text
  comment: Optional help text shown between the label and the slider, announced to assistive technology.
tickStyle:
  type: select
  comment: How the decorative scale marks below the track behave.
  options:
    values:
      - id: uniform
        name: Uniform
      - id: nearest
        name: Highlight nearest
      - id: none
        name: Hidden
tickCount:
  type: number
  comment: Number of decorative scale marks below the track.
