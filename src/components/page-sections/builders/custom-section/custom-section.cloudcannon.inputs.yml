label:
  type: text
  comment: Optional label for the custom section to help identify it in the editor.
contentSections:
  type: array
  comment: The blocks that make up this section.
  options:
    structures: _structures.containerSections
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding applied to the custom section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the custom section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  type: select
  comment: Color scheme theme for the custom section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  label: Lock color scheme
  comment: Keep this section on the color scheme above when a visitor toggles the site theme. Only has an effect when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  comment: Background color for the custom section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: inverse
        name: Inverse
background:
  type: object
  comment: "Optional background: a cover image, a looping HTML5 video (self-hosted), or a repeating tiled pattern image. Shared positioning applies to image and video. Video is hidden when the user prefers reduced motion."
  options:
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
background.type:
  type: select
  label: Background type
  comment: A cover image, a muted autoplay video, or a repeating tiled pattern.
  options:
    values:
      - id: image
        name: Image
      - id: video
        name: Video
      - id: pattern
        name: Pattern
background.positionVertical:
  comment: Image and Video backgrounds only — which part to keep in view when it has to be cropped.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
background.positionHorizontal:
  comment: Image and Video backgrounds only — which part to keep in view when it has to be cropped.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
background.fixed:
  type: switch
  label: Fixed background (parallax)
  comment: Image backgrounds only — pin the image in place so the section scrolls over it.
background.priority:
  type: switch
  label: Prioritize image load
  comment: Image backgrounds only — load the image eagerly, for a section above the fold.
background.imageSource:
  comment: Image and Pattern backgrounds — the image to show, or the tile a Pattern repeats.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
background.patternSize:
  type: select
  label: Pattern tile size
  comment: Pattern backgrounds only — how large each repeated tile is drawn. Natural uses the image's own size.
  options:
    values:
      - id: natural
        name: Natural
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
background.imageAlt:
  comment: Image backgrounds only — alt text for the background image.
  type: textarea
background.videoSource:
  type: file
  label: Video source
  comment: Video backgrounds only — the video to play. Other formats uploaded under the same filename are offered to the browser automatically.
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
background.overlay:
  type: range
  comment: "Overlay in front of the background (-1.0 to 1.0). Negative values darken, positive values lighten."
  options:
    min: -1
    max: 1
    step: 0.1
rounded:
  type: switch
  comment: Round the section's corners.
useDefaultEditableBinding:
  type: switch
  comment: Whether the custom section should use its default editable bindings.
  hidden: true
background.mask:
  type: select
  label: Background fade
  comment: Which part of the background fades out — the faded part reveals the background color. Patterns default to Fade the middle; images and video default to No fade.
  options:
    values:
      - id: none
        name: No fade
      - id: frame
        name: Fade the middle
      - id: vignette
        name: Fade the edges
      - id: top
        name: Fade the top
      - id: bottom
        name: Fade the bottom
      - id: left
        name: Fade the left
      - id: right
        name: Fade the right
      - id: blend
        name: Fade top and bottom
