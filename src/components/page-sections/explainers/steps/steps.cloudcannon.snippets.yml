# `component_name` resolves through the filename-keyed map in
# `src/components/utils/mdxComponents.ts`, where `wrappers/steps/Steps.astro`
# shares this file's basename — the page section wins by path order. Renaming
# either file changes which one `<Steps>` means in MDX.
steps:
  template: mdx_component
  inline: false
  preview:
    text:
      - Steps
    subtext:
      - key: heading
    image: public/component-previews/page-sections/explainers/steps.svg
    icon: format_list_numbered
    gallery:
      image: public/component-previews/page-sections/explainers/steps.svg
      fit: cover
  definitions:
    component_name: Steps
    named_args:
      - editor_key: sectionLabel
        type: string
        optional: true
        remove_empty: true
      - editor_key: maxContentWidth
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingHorizontal
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
      - editor_key: eyebrow
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: items
        type: array
      - editor_key: orientation
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageAspectRatio
        type: string
        optional: true
        remove_empty: true
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/explainers/steps/steps.cloudcannon.inputs.yml
