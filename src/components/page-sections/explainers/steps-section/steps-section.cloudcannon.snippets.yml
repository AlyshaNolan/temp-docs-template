stepsSection:
  template: mdx_component
  inline: false
  preview:
    text:
      - Steps Section
    subtext:
      - key: heading
    image: public/component-previews/page-sections/explainers/steps-section.svg
    icon: format_list_numbered
    gallery:
      image: public/component-previews/page-sections/explainers/steps-section.svg
      fit: cover
  definitions:
    component_name: StepsSection
    named_args:
      - editor_key: eyebrow
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: items
        type: array
      - editor_key: orientation
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageAspectRatio
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/explainers/steps-section/steps-section.cloudcannon.inputs.yml
