  heading: Frequently Asked Questions
  headingLevel: h2
  items:
    - title: How long does a build take?
      contentSections:
        - _component: building-blocks/core-elements/text
          text: Most sites go live inside a week once the content is ready.
          size: md
    - title: Can our team edit the site themselves?
      contentSections:
        - _component: building-blocks/core-elements/text
          text: Yes. Every section is editable on the page, with guardrails so the design holds.
          size: md
    - title: What happens after launch?
      contentSections:
        - _component: building-blocks/core-elements/text
          text: You own the repository and the content. We stay on call for the first month.
          size: md
