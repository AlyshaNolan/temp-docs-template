# Max-width and paddings are left off: `.prose` zeroes them on a nested section
# (see `_prose.css`), so they would change nothing in a docs page.
faqSection:
  template: mdx_component
  inline: false
  preview:
    text:
      - FAQ Section
    subtext:
      - key: heading
    image: public/component-previews/page-sections/explainers/faq-section.svg
    icon: help
    gallery:
      image: public/component-previews/page-sections/explainers/faq-section.svg
      fit: cover
  definitions:
    component_name: FaqSection
    named_args:
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: headingLevel
        type: string
        optional: true
        remove_empty: true
      - editor_key: items
        type: array
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/explainers/faq-section/faq-section.cloudcannon.inputs.yml
