label: Tabbed Content
icon: tab
description: Tabbed panels for showing several things in one section.
value:
  _component: page-sections/explainers/tabbed-content
  sectionLabel: ""
  eyebrow: ""
  heading: One section, several answers
  headingLevel: h2
  subtext: ""
  alignmentHorizontal: start
  items:
    - title: First tab
      subtext: ""
      iconName: ""
      iconColor: default
      contentSections:
        - _component: building-blocks/core-elements/text
          text: What the reader sees when this tab is open.
          size: md
    - title: Second tab
      subtext: ""
      iconName: ""
      iconColor: default
      contentSections:
        - _component: building-blocks/core-elements/text
          text: Each tab holds its own stack of content blocks.
          size: md
  variant: panel
  navigationPosition: top
  maxContentWidth: 2xl
  paddingHorizontal: lg
  paddingVertical: 4xl
  colorScheme: inherit
  lockColorScheme: false
  backgroundColor: base
  background:
    type: image
    positionVertical: top
    positionHorizontal: center
    fixed: false
    priority: false
    imageSource: ""
    imageAlt: ""
    patternSize: natural
    mask: none
    videoSource: null
    overlay: 0
preview:
  text:
    - Tabbed Content
  subtext:
    - key: heading
  image: public/component-previews/page-sections/explainers/tabbed-content.svg
  icon: tab
  gallery:
    image: public/component-previews/page-sections/explainers/tabbed-content.svg
    fit: cover
picker_preview:
  text: Tabbed Content
  subtext: Tabbed panels for showing several things in one section.
  image: public/component-previews/page-sections/explainers/tabbed-content.svg
  icon: tab
  gallery:
    image: public/component-previews/page-sections/explainers/tabbed-content.svg
    fit: cover
_inputs_from_glob:
  - /src/components/page-sections/explainers/tabbed-content/tabbed-content.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/background-mask.yml
_structures:
  contentSelectorItems:
    values:
      - label: Tab
        icon: place_item
        value:
          title: Section Title
          subtext: ""
          iconName: ""
          iconColor: default
          contentSections: []
        preview:
          text:
            - key: title
            - Tab
          subtext:
            - template: A tab containing {contentSections|array_length} content {"block"|pluralize=contentSections}
            - Add content to the tab
        _inputs:
          title:
            type: text
            comment: The label on the tab, and the heading for its panel.
          subtext:
            type: text
            comment: Optional supporting text shown beneath the tab label.
          iconName:
            comment: The name of the icon to display. Sourced from [Heroicons](https://heroicons.com/).
            type: select
            options:
              values: data.icons
          iconColor:
            type: select
            comment: The color of the icon.
            hidden: "!iconName"
            options:
              values:
                - id: default
                  name: Default
                - id: blue
                  name: Blue
                - id: green
                  name: Green
                - id: yellow
                  name: Yellow
                - id: orange
                  name: Orange
                - id: red
                  name: Red
                - id: purple
                  name: Purple
                - id: pink
                  name: Pink
                - id: cyan
                  name: Cyan
          contentSections:
            type: array
            options:
              structures: _structures.contentSelectorSections
        _structures_from_glob:
          - /.cloudcannon/structures/contentSelectorSections.cloudcannon.structures.yml
groups:
  - heading: Content
    inputs:
      - eyebrow
      - heading
      - subtext
      - items
  - heading: Section settings
    comment: Width, spacing, color scheme, and background for this section.
    collapsed: true
    inputs:
      - sectionLabel
      - headingLevel
      - alignmentHorizontal
      - variant
      - navigationPosition
      - maxContentWidth
      - paddingHorizontal
      - paddingVertical
      - colorScheme
      - lockColorScheme
      - backgroundColor
      - background
