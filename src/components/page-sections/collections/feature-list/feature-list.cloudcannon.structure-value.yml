label: Feature List
icon: checklist
description: Compact grid of short feature labels with a line of detail each.
value:
  _component: page-sections/collections/feature-list
  sectionLabel: ""
  eyebrow: ""
  heading: Also included
  headingLevel: h2
  subtext: ""
  alignmentHorizontal: start
  items:
    - title: First feature
      description: what it does, in a few words
      iconName: ""
      iconColor: default
    - title: Second feature
      description: short enough to stay on one line
      iconName: ""
      iconColor: default
    - title: Third feature
      description: three across reads well on a wide screen
      iconName: ""
      iconColor: default
  columns: 3
  gap: md
  rounded: false
  maxContentWidth: 2xl
  paddingHorizontal: lg
  paddingVertical: 4xl
  colorScheme: inherit
  lockColorScheme: false
  backgroundColor: surface
  background:
    type: image
    positionVertical: top
    positionHorizontal: center
    fixed: false
    priority: false
    imageSource: ""
    imageAlt: ""
    patternSize: natural
    mask: none
    videoSource: null
    overlay: 0
preview:
  text:
    - Feature List
  subtext:
    - key: heading
  image: public/component-previews/page-sections/collections/feature-list.svg
  icon: checklist
  gallery:
    image: public/component-previews/page-sections/collections/feature-list.svg
    fit: cover
picker_preview:
  text: Feature List
  subtext: Compact grid of short feature labels with a line of detail each.
  image: public/component-previews/page-sections/collections/feature-list.svg
  icon: checklist
  gallery:
    image: public/component-previews/page-sections/collections/feature-list.svg
    fit: cover
_inputs_from_glob:
  - /src/components/page-sections/collections/feature-list/feature-list.cloudcannon.inputs.yml
_structures:
  featureItems:
    values:
      - label: Feature
        icon: check
        value:
          title: Feature name
          description: what it does, in a few words
          iconName: ""
          iconColor: default
        preview:
          text:
            - key: title
            - Feature
          subtext:
            - key: description
            - Add the detail after the name
        _inputs:
          title:
            type: text
            comment: The feature's name. Keep it to a few words.
          description:
            type: text
            comment: Continues the name after a dash, so write it as a lower-case fragment ("token-driven, respects the system") rather than a sentence.
          iconName:
            comment: Optional icon shown above the name. Sourced from [Heroicons](https://heroicons.com/).
            type: select
            options:
              values: data.icons
          iconColor:
            type: select
            comment: The color of the icon.
            hidden: "!iconName"
            options:
              values:
                - id: default
                  name: Default
                - id: blue
                  name: Blue
                - id: green
                  name: Green
                - id: yellow
                  name: Yellow
                - id: orange
                  name: Orange
                - id: red
                  name: Red
                - id: purple
                  name: Purple
                - id: pink
                  name: Pink
                - id: cyan
                  name: Cyan
groups:
  - heading: Content
    inputs:
      - eyebrow
      - heading
      - subtext
      - items
  - heading: Section settings
    comment: Width, spacing, color scheme, and background for this section.
    collapsed: true
    inputs:
      - sectionLabel
      - headingLevel
      - alignmentHorizontal
      - columns
      - gap
      - rounded
      - maxContentWidth
      - paddingHorizontal
      - paddingVertical
      - colorScheme
      - lockColorScheme
      - backgroundColor
      - background
