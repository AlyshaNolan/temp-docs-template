paths:
  uploads: src/assets/images
  uploads_use_relative_path: false
# Astro parses content with GFM. CloudCannon's editor defaults to plain
# CommonMark, so without this a Markdown table round-trips out of the editor as
# HTML (or as literal pipe text) with nothing reporting an error.
markdown:
  engine: commonmark
  options:
    gfm: true
    table: true
    strikethrough: true
    linkify: true
    code_block_fences: "```"
    escape_snippets_in_code_blocks: true
collections_config:
  landing_pages:
    path: src/content/pages
    url: /[full_slug]/
    icon: web
    _enabled_editors:
      - visual
    add_options:
      - name: Add New Page
        schema: default
        icon: pages
    schemas:
      default:
        name: New Page
        path: .cloudcannon/schemas/page.md
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    new_preview_url: /
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.
      keywords:
        type: array
        comment: Optional meta keywords for this page.
      keywords[*]:
        type: text
  documentation:
    path: src/content/docs
    glob:
      - "**/*.mdx"
    icon: article
    url: /[full_slug]/
    disable_url: false
    include_developer_files: false
    preview:
      metadata:
        - text:
            - key: group
          icon: folder
        - text:
            - key: order
          icon: format_list_numbered
    _editables:
      content:
        allow_custom_markup: true
        remove_custom_markup: false
        styles: public/cloudcannon/editor-styles.css
        blockquote: true
        bold: true
        bulletedlist: true
        code: true
        copyformatting: false
        embed: false
        expandable: false
        format: p h2 h3 h4 h5 h6
        horizontalrule: true
        image: true
        image_size_attributes: false
        indent: false
        italic: true
        link: true
        numberedlist: true
        outdent: false
        redo: true
        removeformat: true
        resize_style: contain
        snippet: true
        strike: false
        subscript: false
        superscript: false
        table: true
        underline: false
        undo: true
    _enabled_editors:
      - content
      - visual
    _inputs:
      title:
        type: text
        comment: Page heading, browser title, and the label in the sidebar.
        cascade: true
      description:
        type: text
        comment: The lede under the title, and the page's meta description.
        cascade: true
      group:
        type: select
        options:
          allow_create: false
          allow_empty: true
          values: data.docsSite.navGroups
          value_key: name
          preview:
            text:
              - key: name
          required: false
        comment: Which sidebar group this page belongs to. Options come from `navGroups`
          in `src/data/docsSite.json` — add one in [Data → Docs
          Site](cloudcannon:collections/data/docsSite.json) to make it
          selectable here.
        cascade: true
      order:
        type: number
        comment: Position within the group. Lower numbers come first.
        cascade: true
      showToc:
        type: switch
        comment: Show the "On this page" list built from the page's headings.
        cascade: true
      showFeedback:
        type: switch
        comment: Show the "Was this page helpful?" block at the foot of the page.
        cascade: true
      showCopyPage:
        type: switch
        comment: Show the "Copy page" menu beside the title. Turn the whole feature off
          in [Data → Docs Site](cloudcannon:collections/data/docsSite.json).
        cascade: true
      showPager:
        type: switch
        comment: Show previous/next links across the sidebar's reading order.
        cascade: true
      keywords:
        type: array
        comment: Optional meta keywords for this page.
        cascade: true
      keywords[*]:
        type: text
        cascade: true
    add_options:
      - name: Add Documentation Page
        icon: article
        schema: default
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.mdx"
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url: /
    schemas:
      default:
        path: .cloudcannon/schemas/doc.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Documentation Page
  changelog:
    path: src/content/changelog
    glob:
      - "**/*.md"
    icon: history
    disable_url: true
    include_developer_files: false
    preview:
      text:
        - key: version
      metadata:
        - text:
            - key: date
          icon: calendar_month
    sort_options:
      - key: date
        order: desc
        label: Newest first
      - key: date
        order: asc
        label: Oldest first
    _enabled_editors:
      - data
    _inputs:
      version:
        type: text
        comment: The release, e.g. "2.4.0". It becomes the section heading and its
          anchor.
        cascade: true
      date:
        type: date
        comment: Release date. The changelog page orders releases by this, newest first.
        cascade: true
      summary:
        type: markdown
        options:
          allow_resize: true
          allow_custom_markup: false
          remove_custom_markup: false
          initial_height: 320
          blockquote: true
          bold: true
          bulletedlist: true
          code: true
          copyformatting: false
          embed: false
          expandable: false
          horizontalrule: false
          image: true
          image_size_attributes: false
          indent: false
          italic: true
          link: true
          numberedlist: true
          outdent: false
          redo: false
          removeformat: true
          resize_style: contain
          snippet: true
          strike: false
          subscript: false
          superscript: false
          table: false
          underline: false
          undo: false
          required: false
        comment: Optional note above this release's changes — what the release is about,
          or an upgrade warning. Leave empty for none.
        cascade: true
      changes:
        type: array
        options:
          structures: _structures.changelogChanges
          disable_add: false
          disable_remove: false
          disable_reorder: false
          required: false
        comment: One line per change.
        cascade: true
    add_options:
      - name: Add Release
        icon: history
        schema: default
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      default:
        path: .cloudcannon/schemas/release.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Release
  data:
    path: src/data
    glob:
      - "**/*.json"
    icon: database
    disable_url: true
    include_developer_files: false
    _enabled_editors:
      - data
    _inputs:
      logoSource:
        type: image
        options:
          paths:
            uploads: src/assets/images
            uploads_use_relative_path: false
          disable_upload_file: false
          disable_direct_input: false
          disable_upload_file_in_file_browser: false
          resize_style: contain
          width: 1920
          height: 1280
          expandable: false
          prevent_resize_existing_files: false
          required: false
        cascade: true
      logoAlternateSource:
        type: image
        options:
          paths:
            uploads: src/assets/images
            uploads_use_relative_path: false
          disable_upload_file: false
          disable_direct_input: false
          disable_upload_file_in_file_browser: false
          resize_style: contain
          width: 1920
          height: 1280
          expandable: false
          prevent_resize_existing_files: false
          required: false
        cascade: true
      image:
        type: image
        options:
          paths:
            uploads: src/assets/images
            uploads_use_relative_path: false
          disable_upload_file: false
          disable_direct_input: false
          disable_upload_file_in_file_browser: false
          resize_style: contain
          width: 1920
          height: 1280
          expandable: false
          prevent_resize_existing_files: false
          required: false
        cascade: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      docsSite:
        path: .cloudcannon/schemas/docsSite.json
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: Docs Site
        preview:
          text:
            - Docs Site
        _inputs:
          markLetter:
            type: text
            comment: One character shown in an accent tile beside the name. Ignored when a
              logo image is set.
            cascade: true
          wordmark:
            type: text
            comment: The site name shown in the header.
            cascade: true
          logoSource:
            comment: Optional logo image, replacing the tile and the name.
            cascade: true
          logoAlternateSource:
            comment: Logo shown in dark mode.
            cascade: true
          logoAlt:
            type: text
            comment: Alt text for the logo image.
            cascade: true
          version:
            type: text
            comment: Badge beside the name, e.g. "v2.4". Leave empty to hide it.
            cascade: true
          themeToggle:
            type: switch
            comment: Show the light/dark toggle in the header. The site still resolves a
              colour scheme without it.
            cascade: true
          defaultTheme:
            type: select
            options:
              allow_empty: true
              values:
                - id: dark
                  name: Dark
                - id: light
                  name: Light
                - id: system
                  name: System
              required: false
            comment: The colour scheme before a reader chooses one. "System" follows their
              operating system; "Dark" and "Light" don't.
            cascade: true
          search:
            type: switch
            comment: Show the search control and bind the ⌘K shortcut.
            cascade: true
          searchPlaceholder:
            type: text
            comment: Placeholder text inside the search overlay.
            cascade: true
          homeLabel:
            type: text
            comment: Label for the standalone link above the first sidebar group.
            cascade: true
          repositoryUrl:
            type: url
            comment: The site's source repository. The "Use this template", repository and
              per-page "Edit this page" links are all built from it. A /tree/<branch>
              suffix names the branch edit links target. Leave empty to hide those links.
            cascade: true
          editPageLabel:
            type: text
            comment: Text of the edit link.
            cascade: true
          topbarLinks:
            type: array
            options:
              structures: _structures.linkItems
              disable_add: false
              disable_remove: false
              disable_reorder: false
              required: false
            comment: Links in the header, right of the site name.
            cascade: true
          navGroups:
            type: array
            options:
              structures: _structures.docsNavGroups
              disable_add: false
              disable_remove: false
              disable_reorder: false
              required: false
            comment: Sidebar group order. A group used by a page but missing here is added
              at the end rather than dropped.
            cascade: true
          copyPage:
            type: object
            comment: The "Copy page" menu beside each documentation page's title.
            cascade: true
          feedback:
            type: object
            comment: The "Was this page helpful?" block.
            cascade: true
      announcementBar:
        path: .cloudcannon/schemas/announcementBar.json
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: Announcement Bar
        preview:
          text:
            - Announcement Bar
        _inputs:
          enabled:
            type: switch
            comment: Show the announcement bar at the top of every page.
            cascade: true
          text:
            type: markdown
            options:
              allow_resize: true
              allow_custom_markup: false
              remove_custom_markup: false
              initial_height: 320
              blockquote: true
              bold: true
              bulletedlist: true
              code: false
              copyformatting: false
              embed: false
              expandable: false
              horizontalrule: false
              image: true
              image_size_attributes: false
              indent: false
              italic: true
              link: true
              numberedlist: true
              outdent: false
              redo: false
              removeformat: true
              resize_style: contain
              snippet: true
              strike: false
              subscript: false
              superscript: false
              table: false
              underline: false
              undo: false
              required: false
            comment: The announcement message. Add a Markdown link for an optional call to
              action.
            cascade: true
      breadcrumbs:
        path: .cloudcannon/schemas/breadcrumbs.json
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: Breadcrumbs
        preview:
          text:
            - Breadcrumbs
        _inputs:
          homeLabel:
            comment: Label for the leading crumb that links to the site root.
            cascade: true
      seo:
        path: .cloudcannon/schemas/seo.json
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: SEO Settings
        preview:
          text:
            - SEO
        _inputs:
          name:
            comment: Site name used in structured data and as the fallback brand name in SEO
              metadata.
            cascade: true
          url:
            comment: Production site URL used for canonical links and structured data.
            cascade: true
          description:
            comment: Default meta description used when a page does not provide its own.
            cascade: true
          logoSource:
            comment: Default image used for social sharing metadata when a page does not
              provide its own.
            cascade: true
          titleFormat:
            comment: Browser title template. Include {title} where the page title should
              appear.
            cascade: true
          twitterSite:
            comment: Optional X (Twitter) handle for the site, including the @, used in
              social share cards.
            cascade: true
collection_groups:
  - heading: Pages
    collections:
      - landing_pages
      - documentation
  - heading: Changelog
    collections:
      - changelog
  - heading: Data
    collections:
      - data
  - heading: New Collections
    collections: []
# Applies to every Visual Editor text region. `block` is the only region tier
# that can carry a Styles menu, which is why the Hero Center heading opts into
# it with `data-type="block"` — a `text` region has no `styles` key at all, and
# `allow_custom_markup` has to stay on or the style's `<span>` is stripped on
# save.
_editables:
  block:
    allow_custom_markup: true
    remove_custom_markup: false
    styles: public/cloudcannon/editor-styles.css
    blockquote: false
    bold: true
    bulletedlist: false
    code: false
    embed: false
    format: false
    horizontalrule: false
    image: false
    italic: true
    link: true
    numberedlist: false
    redo: true
    removeformat: true
    snippet: false
    table: false
    undo: true
  text:
    allow_custom_markup: true
    remove_custom_markup: false
    bold: true
    italic: true
    link: true
    redo: true
    removeformat: true
    undo: true
_inputs:
  pageSections:
    comment: The main sections of the page.
    cascade: true
  logoSource:
    type: image
    cascade: true
  logoAlternateSource:
    type: image
    cascade: true
_snippets_imports:
  mdx: true
data_config:
  icons:
    path: .cloudcannon/data/icons.yml
  autocomplete_tokens:
    path: .cloudcannon/data/autocomplete-tokens.yml
  docsSite:
    path: src/data/docsSite.json
timezone: Etc/UTC
_structures_from_glob:
  - /.cloudcannon/structures/*.cloudcannon.structures.yml
_snippets_from_glob:
  - /**/*.cloudcannon.snippets.yml
