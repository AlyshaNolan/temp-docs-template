# Used by `faq-section` `items` and its MDX snippet. Keep it here: a structure
# declared inside a structure value is invisible to the snippet (free text).
faqItems:
  values:
    - label: FAQ Item
      icon: help
      value:
        title: Question text
        contentSections:
          - _component: building-blocks/core-elements/text
            text: Answer text goes here.
            size: md
      preview:
        text:
          - key: title
          - FAQ Item
        subtext:
          - key: contentSections.0.text
          - Add answer text
      _inputs:
        title:
          type: text
          comment: The question text.
        contentSections:
          type: array
          label: Answer Content
          comment: Content sections for the answer (typically text).
          options:
            structures: _structures.accordionSections
