# Question/answer rows, used by the `faq-section` component's `items` array
# input.
#
# Shared here rather than inline in the structure value: the component's MDX
# snippet points at the same `_structures.faqItems`, and a structure declared
# inside a structure value is invisible to it — the array renders as free text.
faqItems:
  values:
    - label: FAQ Item
      icon: help
      value:
        title: Question text
        contentSections:
          - _component: building-blocks/core-elements/text
            text: Answer text goes here.
            size: md
      preview:
        text:
          - key: title
          - FAQ Item
        subtext:
          - key: contentSections.0.text
          - Add answer text
      _inputs:
        title:
          type: text
          comment: The question text.
        contentSections:
          type: array
          label: Answer Content
          comment: Content sections for the answer (typically text).
          options:
            structures: _structures.accordionSections
      _structures_from_glob:
        - /.cloudcannon/structures/accordionSections.cloudcannon.structures.yml
