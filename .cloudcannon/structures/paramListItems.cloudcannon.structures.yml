# Reference entries, used by the `param-list` component's `params` array input.
#
# Must live here, not in the component's inputs.yml — `_structures` is not a
# valid key in an `_inputs_from_glob` file.
paramListItems:
  values:
    - label: Parameter
      icon: list_alt
      value:
        name: parameterName
        type: string
        required: false
        defaultValue: ""
        description: What this parameter controls.
      _inputs:
        name:
          type: text
          comment: The option's name, written the way a reader would type it, e.g. "site.url".
        type:
          type: text
          comment: Its type, e.g. "string" or "{ light, dark }".
        required:
          type: switch
          comment: Marks the parameter required.
        defaultValue:
          type: text
          comment: The default, shown beside the type. Leave empty when there isn't one.
        description:
          type: markdown
          comment: What the option does and when to reach for it.
          options:
            bold: true
            italic: true
            link: true
            code: true
