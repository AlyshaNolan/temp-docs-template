# Used by `definition-list` `items` and its MDX snippet. Keep it here: a structure
# declared inside a structure value is invisible to the snippet (free text).
definitionListItems:
  values:
    - label: Definition List Item
      value:
        title: "My definition title"
        text: "My definition content"
      preview:
        icon: list
        text:
          - key: title
          - Definition List Item
        subtext:
          - key: text
      _inputs:
        title:
          type: text
          comment: A bolded title for the list item.
        text:
          type: textarea
          comment: The text content of the list item.
