# Used by `footer` `links`/`socials`; `_structures` is invalid in an inputs file.
# Keep `preview` blocks in step with `links`/`socials` structures — without one a
# row draws nothing in the data panel or on canvas.
linkItems:
  style: modal
  values:
    - label: Navigation Link
      icon: link
      description: A navigation link with text and a target.
      value:
        name: Link text
        path: /
      preview:
        text:
          - key: name
          - Navigation Link
        subtext:
          - key: path
          - Add path
      picker_preview:
        text: Navigation Link
        subtext: A navigation link with text and a target.
        icon: link
      _inputs:
        name:
          type: text
          comment: "Display text for the navigation link."
        path:
          type: url
          comment: "URL path for the navigation link."
          options:
            hide_link_to_file: true
            hide_link_to_email_address: true
            hide_link_to_telephone: true
socialItems:
  style: modal
  values:
    - label: Social Link
      icon: share
      description: An icon linking to a social profile.
      value:
        icon: social/github
        link: https://github.com/
        label: ""
      preview:
        text:
          - key: label
          - key: icon
          - Social Link
        subtext:
          - key: link
          - Add link
      picker_preview:
        text: Social Link
        subtext: An icon linking to a social profile.
        icon: share
      _inputs:
        icon:
          type: select
          comment: "Icon for the social media platform. Sourced from [Heroicons](https://heroicons.com/)."
          options:
            values: data.icons
            preview:
              text:
                - key: name
              image:
                - template: src/icons/{id}.svg
        link:
          type: text
          comment: "URL link to the social media profile."
        label:
          type: text
          comment: 'Optional accessible label for the link (e.g. "Visit us on X"). Defaults to "Visit our <icon> page".'
