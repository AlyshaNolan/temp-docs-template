changelogChanges:
  values:
    - label: Change
      icon: history
      value:
        tag: Added
        text: What changed, in one line.
      _inputs:
        tag:
          type: select
          comment: The kind of change. "Breaking" and "Added" are color-coded; anything else renders neutral.
          options:
            values:
              - Added
              - Changed
              - Deprecated
              - Removed
              - Fixed
              - Security
              - Breaking
        text:
          type: markdown
          comment: What changed, in one line.
          options:
            bold: true
            italic: true
            link: true
            code_inline: true
            code_block: false
