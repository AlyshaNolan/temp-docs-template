# `name` must match a page's `group` frontmatter exactly, or that group is
# treated as new and appended. Nothing enforces the match.
docsNavGroups:
  values:
    - label: Group
      icon: folder
      value:
        name: New group
        collapsed: false
      preview:
        text:
          - key: name
          - Group
      _inputs:
        name:
          type: text
          comment: Must match the `group` set on the pages that belong to it.
        collapsed:
          type: switch
          comment: Render the group closed, unless the reader is on a page inside it.
