# Numbered notes, used by the `code-annotations` component's `notes` array
# input.
#
# Must live here, not in the component's inputs.yml — `_structures` is not a
# valid key in an `_inputs_from_glob` file.
codeAnnotations:
  values:
    - label: Note
      icon: format_list_numbered
      value:
        line: 1
        text: ""
      _inputs:
        line:
          type: number
          comment: The 1-based line this note marks. A line past the end of the code is dropped rather than rendered against nothing.
        text:
          type: markdown
          comment: The note. Keep it to a sentence — it sits under the block, not beside it.
          options:
            bold: true
            italic: true
            link: true
            code: true
