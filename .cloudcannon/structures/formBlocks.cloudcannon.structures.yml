# Used by `formBlocks` in `forms/form` and `conversion/cta-form`. Excluded: `form`
# (can't nest in itself) and `segments` (hidden from the picker, still valid in
# content — delete its exclusion line to offer it again).
formBlocks:
  id_key: _component
  style: modal
  values_from_glob:
    - /src/components/building-blocks/forms/**/*.cloudcannon.structure-value.yml
    - "!/src/components/building-blocks/forms/form/form.cloudcannon.structure-value.yml"
    - "!/src/components/building-blocks/forms/segments/segments.cloudcannon.structure-value.yml"
