# Editor-managed redirects, used by the `redirects` data file's `routes` input.
#
# Coupled to `scripts/cms/routing.mjs`, which merges these ahead
# of the rules in `.cloudcannon/routing.json` at build time. A redirect added
# here goes live on the next build, not on save.
redirectRoutes:
  style: modal
  values:
    - label: Redirect
      icon: alt_route
      description: Send an old URL to the page that replaced it.
      value:
        from: /old-path/
        to: /new-path/
        status: "301"
      preview:
        text:
          - key: from
          - Redirect
        subtext:
          - key: to
          - Add a destination
      picker_preview:
        text: Redirect
        subtext: Send an old URL to the page that replaced it.
        icon: alt_route
      _inputs:
        from:
          type: text
          comment: The old address people still have, starting with a slash.
          options:
            required: true
            placeholder: /old-path/
        to:
          type: text
          comment: Where it should go instead — a path on this site, or a full URL elsewhere.
          options:
            required: true
            placeholder: /new-path/
        status:
          type: select
          comment: How permanent this move is.
          options:
            preview:
              text:
                - key: name
              subtext:
                - key: description
            values:
              - id: "301"
                name: Permanent
                description: The page has moved for good. Search engines pass its ranking to the new URL.
              - id: "302"
                name: Temporary
                description: The move will be reversed. Search engines keep the old URL indexed.
