# Language tabs, used by the `code-tabs` component's `tabs` array input.
#
# Must live here, not in the component's inputs.yml — `_structures` is not a
# valid key in an `_inputs_from_glob` file.
codeTabs:
  values:
    - label: Tab
      icon: tab
      value:
        label: npm
        language: bash
        code: npm install
        highlight: ""
      _inputs:
        label:
          type: text
          comment: The tab's name, e.g. "npm" or "Node". Tabs sharing a label agree across every block on the site, which is how the reader's choice carries between pages.
        language:
          type: select
          comment: Language for syntax highlighting.
          options:
            values:
              - id: astro
                name: astro
              - id: bash
                name: bash
              - id: css
                name: css
              - id: diff
                name: diff
              - id: html
                name: html
              - id: js
                name: js
              - id: json
                name: json
              - id: jsx
                name: jsx
              - id: markdown
                name: markdown
              - id: mdx
                name: mdx
              - id: python
                name: python
              - id: ruby
                name: ruby
              - id: sh
                name: sh
              - id: ts
                name: ts
              - id: tsx
                name: tsx
              - id: yaml
                name: yaml
              - id: text
                name: text
        code:
          type: code
          comment: The sample for this tab.
          options:
            max_visible_lines: 20
        highlight:
          type: text
          comment: 'Lines to highlight, 1-based: "2" or "1,4-6".'
