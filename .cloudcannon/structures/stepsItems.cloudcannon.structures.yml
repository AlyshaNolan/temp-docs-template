# Shared by the Steps block and the Steps Section, and their snippets. Keep it here:
# a structure declared inside a structure value is invisible to a snippet (free text).
stepsItems:
  values:
    - label: Step
      icon: format_list_numbered
      value:
        image: ""
        imageAlt: ""
        contentSections:
          - _component: building-blocks/core-elements/heading
            text: Step heading
            level: h3
            size: xs
          - _component: building-blocks/core-elements/simple-text
            text: What happens in this step.
            size: sm
      preview:
        text:
          - key: contentSections.0.text
          - Step
        subtext:
          - key: contentSections.1.text
          - Add one or more content blocks
        image:
          - key: image
      _inputs:
        image:
          type: image
          comment: Optional featured photo. Every step shares the parent's image aspect ratio.
          options:
            paths:
              static: ""
              uploads: src/assets/images
        imageAlt:
          type: text
          comment: Accessible description of the step image.
        contentSections:
          type: array
          label: Step content
          comment: Building blocks for this step — typically a heading and a short description.
          options:
            structures: _structures.stepsItemSections
